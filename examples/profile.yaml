# Example .caddie.yaml: this file lives directly in a project folder and
# IS the profile (no separate "environment" definition to point at).
#
# Create one with `caddie init`, edit it with `caddie edit`.

name: "Backend API"
description: "Skills for the backend-api service"

# Skill patterns matched against the canonical store (~/.config/caddie/skills/).
# Inclusion globs form a union; !-prefixed globs subtract from that set.
# Exclusions always win, regardless of order. Empty or exclusion-only lists
# activate nothing. Quote patterns and keep comments on separate lines.
skills:
  # All superpowers skills except writing-skills
  - "superpowers:*"
  - "!superpowers:writing-skills"
  # gws-gmail-send, gws-gmail-search, etc.
  - "gws:gmail-*"
  # Hand-written, repo-less skills
  - "local:*"
